<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div class="app-container">
    <h1>LISTA DE COMPRAS</h1>

    <form id="form-item" onsubmit="adicionarItem(event)">
      <div class="input-group">
        <input type="text" id="nome-item" placeholder="DESCRIÇÃO DO ITEM" required autocomplete="off">
      </div>

      <div class="input-group">
        <input type="text" id="marca-item" placeholder="MARCA (OPCIONAL)" autocomplete="off">
      </div>

      <div class="input-row">
        <input type="number" id="qtd-item" placeholder="QTD" step="any" min="0.01" required>
        
        <select id="medida-item">
          <option value="UN">UN</option>
          <option value="KG">KG</option>
          <option value="L">L</option>
          <option value="M">M</option>
          <option value="CX">CX</option>
          <option value="PCT">PCT</option>
          <option value="PEÇA">PEÇA</option>
        </select>
      </div>

      <button type="submit" class="btn-adicionar">ADICIONAR ITEM</button>
    </form>

    <div class="lista-header">
      <span>ITENS DA LISTA</span>
      <button onclick="limparLista()" class="btn-limpar">LIMPAR TUDO</button>
    </div>

    <ul id="lista-itens"></ul>

    <div class="acoes-container">
      <button onclick="compartilharPDF()" class="btn-pdf">
        📄 ENVIAR / COMPARTILHAR PDF
      </button>
      <button onclick="enviarWhatsAppTexto()" class="btn-whatsapp">
        💬 ENVIAR VIA TEXTO
      </button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Modelo oculto para renderização da folha PDF -->
  <div id="pdf-template" style="display: none;">
    <div style="padding: 20px; font-family: Arial, sans-serif; color: #1a1a1a;">
      <h2 style="text-align: center; color: #2e7d32; border-bottom: 2px solid #2e7d32; padding-bottom: 10px; margin-bottom: 20px;">
        LISTA DE COMPRAS
      </h2>
      <p id="pdf-data" style="text-align: right; font-size: 12px; color: #666; margin-bottom: 15px;"></p>
      <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
        <thead>
          <tr style="background-color: #2e7d32; color: #ffffff;">
            <th style="border: 1px solid #ccc; padding: 10px; text-align: left;">ITEM</th>
            <th style="border: 1px solid #ccc; padding: 10px; text-align: left;">MARCA</th>
            <th style="border: 1px solid #ccc; padding: 10px; text-align: center;">QTD</th>
            <th style="border: 1px solid #ccc; padding: 10px; text-align: center;">MEDIDA</th>
          </tr>
        </thead>
        <tbody id="pdf-tbody">
        </tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
