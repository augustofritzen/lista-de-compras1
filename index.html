<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras - Choperia 737</title>
  <link rel="stylesheet" href="style.css">
  <!-- Biblioteca html2pdf para geração de PDF em fallback -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <!-- Cabeçalho Superior -->
  <header class="top-bar">
    <h1 class="top-title">lista de compras</h1>
    <div class="logo-header">737</div>
  </header>

  <!-- Container Principal -->
  <main class="container">
    <h2 class="main-title">LISTA DE COMPRAS</h2>

    <!-- Formulário de Entrada -->
    <form id="form-item" onsubmit="adicionarItem(event)">
      <div class="form-group">
        <input type="text" id="nome-item" placeholder="DESCRIÇÃO DO ITEM" required>
      </div>

      <div class="form-group">
        <input type="text" id="marca-item" placeholder="MARCA (OPCIONAL)">
      </div>

      <div class="form-row">
        <input type="number" id="qtd-item" placeholder="QTD" step="any" min="0.01" required>
        <select id="medida-item">
          <option value="UN">UN</option>
          <option value="KG">KG</option>

          <option value="CX">CX</option>
          <option value="L">L</option>
          <option value="PEÇA">PEÇA</option>
          <option value="PCT">PCT</option>
        </select>
        <button type="submit" class="btn-adicionar">+</button>
      </div>
    </form>

    <!-- Cabeçalho da Lista -->
    <div class="list-header">
      <span>ITENS DA LISTA</span>
      <button type="button" class="btn-limpar" onclick="limparLista()">LIMPAR TUDO</button>
    </div>

    <!-- Lista Dinâmica de Itens -->
    <ul id="lista-itens"></ul>

    <!-- Botões de Ação -->
    <div class="action-buttons">
      <button type="button" class="btn-action btn-pdf" onclick="compartilharPDF()">
        📄 ENVIAR / COMPARTILHAR PDF
      </button>
      <button type="button" class="btn-action btn-texto" onclick="enviarWhatsAppTexto()">
        💬 ENVIAR VIA TEXTO
      </button>
    </div>
  </main>

  <!-- Template Oculto para Geração do PDF -->
  <div id="pdf-template" style="display: none; padding: 20px; font-family: Arial, sans-serif;">
    <div style="text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px;">
      <h2 style="margin: 0; color: #222;">CHOPERIA 737 - LISTA DE COMPRAS</h2>
      <p id="pdf-data" style="margin: 5px 0 0 0; color: #666; font-size: 14px;"></p>
    </div>
    <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
      <thead>
        <tr style="background-color: #f2f2f2;">
          <th style="border: 1px solid #ccc; padding: 8px; text-align: left;">Descrição</th>
          <th style="border: 1px solid #ccc; padding: 8px; text-align: left;">Marca</th>
          <th style="border: 1px solid #ccc; padding: 8px; text-align: center;">Qtd</th>
          <th style="border: 1px solid #ccc; padding: 8px; text-align: center;">Unidade</th>
        </tr>
      </thead>
      <tbody id="pdf-tbody"></tbody>
    </table>
  </div>

  <!-- Notificação Toast -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
