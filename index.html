<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras - Choperia 737</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Lista de Compras</h1>
    <h2>Choperia 737</h2>

    <!-- Formulário para adicionar itens -->
    <form id="form-item" onsubmit="adicionarItem(event)">
      <div class="input-group">
        <input type="text" id="nome-item" placeholder="Descrição do item (ex: Coxão Mole)" required autofocus>
      </div>

      <div class="input-group inline">
        <input type="text" id="marca-item" placeholder="Marca / Obs (opcional)">
        <input type="number" id="qtd-item" placeholder="Qtd" step="any" min="0.01" required>
        
        <select id="medida-item">
          <option value="UN">UN</option>
          <option value="KG">KG</option>
          <option value="PEÇA">PEÇA</option>
          <option value="L">L</option>
          <option value="CX">CX</option>
          <option value="PCT">PCT</option>
          <option value="FD">FD</option>
        </select>

        <button type="submit" class="btn-adicionar">+</button>
      </div>
    </form>

    <!-- Lista de Itens -->
    <ul id="lista-itens"></ul>

    <!-- Ações e Exportação -->
    <div class="acoes-container">
      <button type="button" class="btn-whatsapp" onclick="enviarWhatsAppTexto()">
        📲 Enviar no WhatsApp
      </button>

      <button type="button" class="btn-txt" onclick="exportarBlocoDeNotas()">
        📄 Salvar no Bloco de Notas
      </button>

      <div class="botoes-secundarios">
        <button type="button" class="btn-limpar" onclick="limparLista()">🧹 Limpar Lista</button>
        <button type="button" class="btn-restaurar" onclick="restaurarUltimaLista()">↩️ Restaurar</button>
      </div>
    </div>

    <!-- Opção de personalizar o fundo -->
    <div class="fundo-control">
      <label for="input-fundo">📷 Alterar Fundo</label>
      <input type="file" id="input-fundo" accept="image/*" onchange="alterarFundo(event)">
    </div>
  </div>

  <!-- Notificação Toast -->
  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
