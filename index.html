<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras - Choperia 737</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho Superior com Botão de Personalizar Fundo -->
  <header class="top-bar">
    <h1 class="top-title">lista de compras</h1>
    <div class="header-actions">
      <label for="input-bg" class="btn-change-bg" title="Alterar Imagem de Fundo">📷</label>
      <input type="file" id="input-bg" accept="image/*" onchange="alterarFundo(event)" style="display: none;">
      <div class="logo-header">737</div>
    </div>
  </header>

  <!-- Container Principal -->
  <main class="container">
    <h2 class="main-title">LISTA DE COMPRAS</h2>

    <!-- Formulário de Entrada -->
    <form id="form-item" onsubmit="adicionarItem(event)">
      <div class="form-group">
        <input type="text" id="nome-item" placeholder="DESCRIÇÃO DO ITEM" required>
      </div>

      <div class="form-group">
        <input type="text" id="marca-item" placeholder="MARCA (OPCIONAL)">
      </div>

      <div class="form-row">
        <input type="number" id="qtd-item" placeholder="QTD" step="any" min="0.01" required>
        <select id="medida-item">
          <option value="UN">UN</option>
          <option value="KG">KG</option>
          <option value="BISNAGA">BISNAGA</option>
          <option value="CX">CX</option>
          <option value="L">LITROS</option>
          <option value="PEÇA">PEÇA</option>
          <option value="PCT">PACOTE</option>
          <option value="BALDE">BALDE</option>
          <option value="BALDINHO">BALDINHO</option>
          <option value="POTE">POTE</option>
        </select>
        <button type="submit" class="btn-adicionar">+</button>
      </div>
    </form>

    <!-- Cabeçalho da Lista -->
    <div class="list-header">
      <span>ITENS DA LISTA</span>
      <button type="button" class="btn-limpar" onclick="limparLista()">LIMPAR TUDO</button>
    </div>

    <!-- Lista Dinâmica de Itens -->
    <ul id="lista-itens"></ul>

    <!-- Botões de Ação -->
    <div class="action-buttons">
      <button type="button" class="btn-action btn-texto" onclick="enviarWhatsAppTexto()">
        💬 ENVIAR VIA TEXTO
      </button>
      <button type="button" class="btn-action btn-restaurar" onclick="restaurarUltimaLista()">
        🔄 RESTAURAR ÚLTIMA LISTA
      </button>
    </div>
  </main>

  <!-- Notificação Toast -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
